
# Direct transfer to Mars
run:
  name: direct_to_mars
  output_dir: results

asteroid:
  # The departure burn is applied at aphelion.
  semi_major_axis_au: 44.0526
  eccentricity: 0.035557
  radius_km: 5.6
  density_kg_m3: 1000

engine:
  isp_s: 400

target:
  semi_major_axis_au: 1.524
  mass_msun: 3.23e-7
  radius_km: 3390

gravity_assist:
  enabled: false
  semi_major_axis_au: 5.203
  mass_msun: 9.545e-4
  radius_km: 71492
  aim_offset_rad: 0.0
  post_flyby_wait_yr: 2.0

simulation:
  fine_samples: 20000
  search_time_factor: 1.3

outputs:
  save_figures: true
  show_figures: false
  figure_format: png
